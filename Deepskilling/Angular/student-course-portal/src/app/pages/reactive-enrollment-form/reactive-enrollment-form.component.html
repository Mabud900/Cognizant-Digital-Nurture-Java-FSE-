<h2>Reactive Enrollment Form</h2>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <div>
    <label>Student Name</label>
    <input formControlName="studentName">
    <div *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']">
      Name is required.
    </div>
    <div *ngIf="enrollForm.get('studentName')?.errors?.['minlength']">
      Name must be at least 3 characters.
    </div>
  </div>

  <div>
    <label>Student Email</label>
    <input formControlName="studentEmail">
    <div *ngIf="enrollForm.get('studentEmail')?.pending">Checking email…</div>
    <div *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">This email is already taken.</div>
  </div>

  <div>
    <label>Course Code</label>
    <input formControlName="courseId" placeholder="e.g. CS101">
    <div *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">
      Course code starting with XX is not allowed.
    </div>
  </div>

  <div>
    <label>Preferred Semester</label>
    <select formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div>
    <label><input type="checkbox" formControlName="agreeToTerms"> I agree to the terms</label>
  </div>

  <div>
    <h4>Additional Courses</h4>
    <div *ngFor="let ctrl of additionalCourses.controls; let i = index">
      <input [formControl]="$any(ctrl)">
      <button type="button" (click)="removeCourse(i)">Remove</button>
    </div>
    <button type="button" (click)="addCourse()">Add Another Course</button>
  </div>

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
</form>
