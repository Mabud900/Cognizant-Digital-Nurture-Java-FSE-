<h2>Enrollment Request Form</h2>

<form #enrollForm="ngForm"
      (ngSubmit)="onSubmit(enrollForm)">

  <!-- Name -->

  <div>
    <label>Name:</label>

    <input
      type="text"
      name="studentName"
      [(ngModel)]="studentName"
      required
      minlength="3"
      #nameCtrl="ngModel">

    <span
      *ngIf="nameCtrl.touched &&
             nameCtrl.errors?.['required']">
      Name is required
    </span>

    <span
      *ngIf="nameCtrl.touched &&
             nameCtrl.errors?.['minlength']">
      Name must be at least 3 characters
    </span>

  </div>

  <br>

  <!-- Email -->

  <div>

    <label>Email:</label>

    <input
      type="email"
      name="studentEmail"
      [(ngModel)]="studentEmail"
      required
      email
      #emailCtrl="ngModel">

    <span
      *ngIf="emailCtrl.touched &&
             emailCtrl.errors?.['required']">
      Email is required
    </span>

    <span
      *ngIf="emailCtrl.touched &&
             emailCtrl.errors?.['email']">
      Invalid email
    </span>

  </div>

  <br>

  <!-- Course ID -->

  <div>

    <label>Course ID:</label>

    <input
      type="number"
      name="courseId"
      [(ngModel)]="courseId"
      required
      #courseCtrl="ngModel">

    <span
      *ngIf="courseCtrl.touched &&
             courseCtrl.errors?.['required']">
      Course ID is required
    </span>

  </div>

  <br>

  <!-- Semester -->

  <div>

    <label>Preferred Semester:</label>

    <select
      name="preferredSemester"
      [(ngModel)]="preferredSemester"
      required>

      <option value="">Select</option>
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>

    </select>

  </div>

  <br>

  <!-- Terms -->

  <div>

    <input
      type="checkbox"
      name="agreeToTerms"
      [(ngModel)]="agreeToTerms"
      required
      #termsCtrl="ngModel">

    I agree to terms

    <span
      *ngIf="termsCtrl.touched &&
             termsCtrl.errors?.['required']">
      Required
    </span>

  </div>

  <br>

  <button
    type="submit"
    [disabled]="enrollForm.invalid">

    Submit

  </button>

  <button
    type="button"
    (click)="enrollForm.resetForm()">

    Reset

  </button>

</form>

<div *ngIf="submitted">
  Enrollment request submitted successfully!
</div>
